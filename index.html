
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MovieHub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:white;font-family:Arial}
header{background:#191b24;padding:18px;position:sticky;top:0}
.logo{font-size:25px;font-weight:bold;color:#ffb52e}
.hero{padding:35px 18px;background:linear-gradient(120deg,#393044,#101116)}
.hero h1{font-size:30px}
.search{padding:15px}
input,textarea{width:100%;padding:13px;margin:7px 0;background:#252834;color:white;border:1px solid #555;border-radius:8px}
textarea{min-height:90px}
button{padding:12px 17px;background:#ffb52e;color:#111;border:0;border-radius:7px;font-weight:bold}
.movies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;padding:13px}
.movie{background:#20212a;border-radius:10px;overflow:hidden}
.movie img{width:100%;height:220px;object-fit:cover}
.info{padding:11px}
.info p{font-size:13px;color:#bbb}
.watch{display:block;text-align:center;background:#ffb52e;color:#111;padding:11px;text-decoration:none;border-radius:7px}
.panel{background:#20212a;padding:16px;border-radius:10px;margin:12px 0}
.hidden{display:none!important}
#admin{max-width:650px;margin:auto;padding:16px}
.muted{color:#aaa;font-size:13px}
.status{color:#ffd27b;font-size:13px}
.row{display:flex;gap:8px}
.row button{flex:1}
.danger{background:#a93232;color:white}
.secondary{background:#454957;color:white}
footer{text-align:center;padding:25px;color:#999}
@media(min-width:700px){.movies{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header><div class="logo">🎬 MOVIEHUB</div></header>

<main id="home">
<section class="hero">
<h1>Discover Your Next Movie</h1>
<p>Explore movies and official viewing options.</p>
</section>

<div class="search">
<input id="search" placeholder="🔍 Search movies...">
</div>

<h2 style="padding-left:15px">Latest Movies</h2>
<div class="movies" id="movieList">Loading...</div>
<footer>© 2026 MovieHub</footer>
</main>

<section id="admin" class="hidden">
<h2>🔐 Admin Login</h2>

<div id="loginPanel" class="panel">
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="loginStatus" class="status"></p>
</div>

<div id="dashboard" class="hidden">
<div class="panel">
<h2>Admin Dashboard</h2>
<button id="logoutBtn" class="secondary">Logout</button>
</div>

<div class="panel">
<h3 id="formHeading">Add New Movie</h3>
<input id="title" placeholder="Movie Name">
<input id="poster" type="url" placeholder="Poster Image URL">
<textarea id="description" placeholder="Movie Description"></textarea>
<input id="category" placeholder="Category">
<input id="year" type="number" placeholder="Release Year">
<input id="watchUrl" type="url" placeholder="Authorized Watch / Download URL">

<div class="row">
<button id="saveBtn">Save Movie</button>
<button id="clearBtn" class="secondary">Clear</button>
</div>
<p id="saveStatus" class="status"></p>
</div>

<h3>Manage Movies</h3>
<div id="manageList"></div>
</div>
</section>

<script>
const SUPABASE_URL =
"https://dpoukmguisrnjeppunip.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_wWaDBcJIp9UfyJxEreo1lg_ZBKj4tPL";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);
let editingId = null;

function safe(value){
return String(value ?? "").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
}

function validUrl(value){
try{
const u=new URL(value);
return u.protocol==="https:" || u.protocol==="http:";
}catch{return false;}
}

async function loadMovies(){
const box=$("movieList");
box.textContent="Loading movies...";

const {data,error}=await db.from("movies")
.select("*").order("created_at",{ascending:false});

if(error){
box.textContent="Unable to load movies.";
return;
}

renderMovies(data||[]);
}

function renderMovies(data){
const q=$("search").value.toLowerCase();
const box=$("movieList");
box.innerHTML="";

const filtered=data.filter(m=>
`${m.title||""} ${m.category||""} ${m.description||""}`
.toLowerCase().includes(q)
);

if(!filtered.length){
box.textContent="No movies found.";
return;
}

filtered.forEach(m=>{
const card=document.createElement("div");
card.className="movie";

const poster=validUrl(m.poster_url||"")
?m.poster_url
:"https://placehold.co/400x600/252535/ffffff?text=MovieHub";

const watch=validUrl(m.watch_url||"")
?`<a class="watch" href="${safe(m.watch_url)}" target="_blank" rel="noopener">Watch Options</a>`
:"<p>Viewing link unavailable</p>";

card.innerHTML=`
<img src="${safe(poster)}" alt="${safe(m.title)}">
<div class="info">
<h3>${safe(m.title)}</h3>
<p>${safe(m.category)} • ${safe(m.release_year)}</p>
<p>${safe(m.description)}</p>
${watch}
</div>`;

box.appendChild(card);
});
}

async function isAdmin(userId){
const {data,error}=await db.from("admins")
.select("user_id")
.eq("user_id",userId)
.maybeSingle();

return !error && !!data;
}

async function login(){
$("loginBtn").disabled=true;
$("loginStatus").textContent="Checking...";

const {data,error}=await db.auth.signInWithPassword({
email:$("email").value.trim(),
password:$("password").value
});

$("loginBtn").disabled=false;

if(error){
$("loginStatus").textContent=error.message;
return;
}

if(!await isAdmin(data.user.id)){
await db.auth.signOut();
$("loginStatus").textContent="Unauthorized account!";
return;
}

$("loginPanel").classList.add("hidden");
$("dashboard").classList.remove("hidden");
await loadManage();
}

async function saveMovie(){
const title=$("title").value.trim();
const poster=$("poster").value.trim();
const watch=$("watchUrl").value.trim();

if(!title){
$("saveStatus").textContent="Movie name required.";
return;
}

if(poster && !validUrl(poster)){
$("saveStatus").textContent="Invalid poster URL.";
return;
}

if(watch && !validUrl(watch)){
$("saveStatus").textContent="Invalid watch URL.";
return;
}

const movie={
title:title,
poster_url:poster||null,
description:$("description").value.trim()||null,
category:$("category").value.trim()||null,
release_year:$("year").value?Number($("year").value):null,
watch_url:watch||null
};

const result=editingId
?await db.from("movies").update(movie).eq("id",editingId)
:await db.from("movies").insert(movie);

if(result.error){
$("saveStatus").textContent=result.error.message;
return;
}

$("saveStatus").textContent="Movie saved successfully!";
clearForm();
await loadManage();
await loadMovies();
}

async function loadManage(){
const {data,error}=await db.from("movies")
.select("id,title").order("created_at",{ascending:false});

const box=$("manageList");
box.innerHTML="";

if(error){
box.textContent=error.message;
return;
}

if(!data.length){
box.textContent="No movies added yet.";
return;
}

data.forEach(m=>{
const div=document.createElement("div");
div.className="panel";
const name=document.createElement("b");
name.textContent=m.title;

const edit=document.createElement("button");
edit.textContent="Edit";
edit.className="secondary";
edit.onclick=()=>editMovie(m.id);

const del=document.createElement("button");
del.textContent="Delete";
del.className="danger";
del.onclick=()=>deleteMovie(m.id);

div.append(name,document.createElement("br"),edit,del);
box.appendChild(div);
});
}

async function editMovie(id){
const {data,error}=await db.from("movies")
.select("*").eq("id",id).single();

if(error)return alert(error.message);

editingId=id;
$("formHeading").textContent="Edit Movie";
$("title").value=data.title||"";
$("poster").value=data.poster_url||"";
$("description").value=data.description||"";
$("category").value=data.category||"";
$("year").value=data.release_year||"";
$("watchUrl").value=data.watch_url||"";
window.scrollTo(0,0);
}

async function deleteMovie(id){
if(!confirm("Delete this movie?"))return;

const {error}=await db.from("movies").delete().eq("id",id);

if(error)return alert(error.message);

await loadManage();
await loadMovies();
}

function clearForm(){
editingId=null;
$("formHeading").textContent="Add New Movie";
["title","poster","description","category","year","watchUrl"]
.forEach(id=>$(id).value="");
}

async function logout(){
await db.auth.signOut();
$("dashboard").classList.add("hidden");
$("loginPanel").classList.remove("hidden");
$("password").value="";
}

async function start(){
if(new URLSearchParams(location.search).get("admin")!=="1"){
await loadMovies();
return;
}

$("home").classList.add("hidden");
$("admin").classList.remove("hidden");

const {data}=await db.auth.getUser();

if(data.user && await isAdmin(data.user.id)){
$("loginPanel").classList.add("hidden");
$("dashboard").classList.remove("hidden");
await loadManage();
}else if(data.user){
await db.auth.signOut();
}
}

$("search").addEventListener("input",loadMovies);
$("loginBtn").addEventListener("click",login);
$("saveBtn").addEventListener("click",saveMovie);
$("clearBtn").addEventListener("click",clearForm);
$("logoutBtn").addEventListener("click",logout);

start();
</script>
</body>
</html>
