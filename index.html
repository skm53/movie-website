
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieZone</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{background:#181818;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:25px;color:#ff3045;font-weight:bold;cursor:pointer}
input,textarea,select{width:100%;padding:12px;margin:8px 0;background:#242424;color:white;border:1px solid #444;border-radius:7px;font-size:15px}
.search{max-width:420px}
button{padding:11px 16px;border:0;border-radius:7px;background:#e50914;color:white;font-weight:bold;cursor:pointer}
.container{max-width:1200px;margin:auto;padding:20px}
h2{font-size:23px}
.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.category{background:#292929;padding:20px 8px;text-align:center;border-radius:10px;font-size:18px;cursor:pointer}
.category:active,.category:hover{background:#e50914}
.movie-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.movie-card{background:#1e1e1e;border-radius:9px;overflow:hidden;cursor:pointer}
.movie-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.movie-info{padding:8px}
.movie-info h3{font-size:14px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.movie-info p{font-size:12px;color:#aaa;margin:0}
.hidden{display:none!important}
.page-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-btn,.secondary{background:#444}
.admin-box{max-width:650px;margin:20px auto;background:#1d1d1d;padding:20px;border-radius:10px}
.admin-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#292929;padding:12px;margin:8px 0;border-radius:7px}
.admin-item span{overflow-wrap:anywhere}
.danger{background:#b00020}
.modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal-box{background:#222;padding:20px;border-radius:10px;width:100%;max-width:430px;max-height:90vh;overflow:auto}
.modal-box img{width:130px;max-height:190px;object-fit:cover}
.close{float:right;background:#444}
.empty{color:#aaa;padding:15px 0}
footer{text-align:center;color:#777;padding:30px}
@media(max-width:700px){
 .categories{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
 .category{font-size:17px;padding:18px 5px}
 .movie-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
 .container{padding:14px}
 .movie-info{padding:6px}
 .movie-info h3{font-size:12px}
 header{display:block}
 .logo{margin-bottom:12px}
 .search{max-width:none}
}
@media(min-width:701px) and (max-width:1000px){
 .movie-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>

<header>
 <div class="logo" onclick="goHome()">🎬 MovieZone</div>
 <input class="search" id="homeSearch" placeholder="Search movies..." oninput="searchHome()">
</header>

<main id="homePage" class="container">
 <h2>Browse Categories</h2>
 <div class="categories" id="categoryTiles"></div>
 <h2>Latest Uploads</h2>
 <div class="movie-grid" id="latestMovies"></div>
 <p id="homeEmpty" class="empty hidden">No movies available.</p>
</main>

<main id="categoryPage" class="container hidden">
 <div class="page-title">
  <button class="back-btn" onclick="goHome()">← Home</button>
  <h2 id="categoryHeading"></h2>
 </div>
 <input id="categorySearch" placeholder="Search in this category..." oninput="searchCategory()">
 <div class="movie-grid" id="categoryMovies"></div>
 <p id="categoryEmpty" class="empty hidden">No movies found.</p>
</main>

<main id="adminPage" class="container hidden">
 <div class="admin-box">
  <div class="page-title">
   <h2>Admin Panel</h2>
   <button class="back-btn" onclick="goHome()">Home</button>
  </div>
  <div id="loginBox">
   <h3>Admin Login</h3>
   <input id="adminEmail" type="email" placeholder="Admin email">
   <input id="adminPassword" type="password" placeholder="Password">
   <button onclick="adminLogin()">Login</button>
   <p id="loginMessage"></p>
  </div>
  <div id="manageBox" class="hidden">
   <h3 id="formHeading">Add New Movie</h3>
   <input type="hidden" id="movieId">
   <input id="movieTitle" placeholder="Movie title">
   <textarea id="movieDescription" placeholder="Movie description"></textarea>
   <input id="moviePoster" placeholder="Direct poster image URL">
   <select id="movieCategory">
    <option value="Bengali">Bengali</option>
    <option value="Bollywood">Bollywood</option>
    <option value="Hollywood">Hollywood</option>
    <option value="South">South</option>
    <option value="Web Series">Web Series</option>
   </select>
   <input id="movieYear" type="number" placeholder="Release year">
   <input id="movieWatch" placeholder="Authorized watch / download URL">
   <button onclick="saveMovie()">Save Movie</button>
   <button class="secondary" onclick="clearForm()">Clear</button>
   <button class="danger" onclick="adminLogout()">Logout</button>
   <p id="adminMessage"></p>
   <h3>Manage Movies</h3>
   <div id="adminMovieList"></div>
  </div>
 </div>
</main>

<div id="movieModal" class="modal hidden" onclick="closeModal(event)">
 <div class="modal-box">
  <button class="close" onclick="hideModal()">✕</button>
  <div id="modalContent"></div>
 </div>
</div>

<footer>MovieZone</footer>

<script>
const SUPABASE_URL="https://dpoukmguisrnjeppunip.supabase.co";
const SUPABASE_KEY="sb_publishable_wWaDBcJIp9UfyJxEreo1lg_ZBKj4tPL";
const ADMIN_UID="c787b61b-1a0d-44f0-881f-0cefefbcbf8b";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const categories=["Bengali","Bollywood","Hollywood","South","Web Series"];
let movies=[];
let currentCategory=null;

function safe(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function normalizeCategory(value){
 const c=String(value||"").toLowerCase().trim();
 if(c.includes("bengali")) return "Bengali";
 if(c.includes("bollywood")) return "Bollywood";
 if(c.includes("hollywood")) return "Hollywood";
 if(c.includes("south")) return "South";
 if(c.includes("web") && c.includes("series")) return "Web Series";
 return "";
}

function getRoute(){
 const p=new URLSearchParams(location.search);
 if(p.get("admin")==="1") return "admin";
 const c=p.get("category");
 return categories.includes(c)?c:"home";
}

function goHome(){
 location.href=location.pathname;
}

function openCategory(category){
 location.href=location.pathname+"?category="+encodeURIComponent(category);
}

function showRoute(){
 const route=getRoute();
 currentCategory=categories.includes(route)?route:null;
 document.getElementById("homePage").classList.toggle("hidden",route!=="home");
 document.getElementById("categoryPage").classList.toggle("hidden",!currentCategory);
 document.getElementById("adminPage").classList.toggle("hidden",route!=="admin");
 document.getElementById("homeSearch").classList.toggle("hidden",route!=="home");
 if(currentCategory){
  document.getElementById("categoryHeading").textContent=currentCategory+" Movies";
 }
}

function drawCategories(){
 document.getElementById("categoryTiles").innerHTML=categories.map(c=>
 `<div class="category" onclick="openCategory('${c}')">${safe(c)}</div>`
 ).join("");
}

function movieCard(m){
 return `<div class="movie-card" onclick="showMovie(${Number(m.id)})">
 <img src="${safe(m.poster_url||"")}" alt="${safe(m.title)}" loading="lazy"
 onerror="this.style.background='#333';this.alt='Poster unavailable'">
 <div class="movie-info"><h3>${safe(m.title)}</h3>
 <p>${safe(m.release_year||"")} · ${safe(m.category||"")}</p></div></div>`;
}

async function loadMovies(){
 const {data,error}=await db.from("movies").select("*").order("created_at",{ascending:false});
 if(error){
  document.getElementById("latestMovies").innerHTML="<p>Could not load movies. Check database permissions.</p>";
  console.error(error);
  return;
 }
 movies=data||[];
 renderHome();
 if(currentCategory) renderCategory();
}

function renderHome(list=movies){
 const latest=list.slice(0,12);
 document.getElementById("latestMovies").innerHTML=latest.map(movieCard).join("");
 document.getElementById("homeEmpty").classList.toggle("hidden",latest.length>0);
}

function searchHome(){
 const q=document.getElementById("homeSearch").value.toLowerCase().trim();
 renderHome(movies.filter(m=>
 (m.title||"").toLowerCase().includes(q)||
 normalizeCategory(m.category).toLowerCase().includes(q)
 ));
}

function renderCategory(list){
 const items=(list||movies).filter(m=>normalizeCategory(m.category)===currentCategory);
 document.getElementById("categoryMovies").innerHTML=items.map(movieCard).join("");
 document.getElementById("categoryEmpty").classList.toggle("hidden",items.length>0);
}

function searchCategory(){
 const q=document.getElementById("categorySearch").value.toLowerCase().trim();
 const filtered=movies.filter(m=>
 normalizeCategory(m.category)===currentCategory &&
 ((m.title||"").toLowerCase().includes(q)||
 (m.description||"").toLowerCase().includes(q))
 );
 renderCategory(filtered);
}

function showMovie(id){
 const m=movies.find(x=>Number(x.id)===Number(id));
 if(!m)return;
 document.getElementById("modalContent").innerHTML=`
 <h2>${safe(m.title)}</h2>
 <img src="${safe(m.poster_url||"")}" alt="${safe(m.title)}">
 <p>${safe(m.category)} · ${safe(m.release_year||"")}</p>
 <p>${safe(m.description||"No description available.")}</p>
 ${m.watch_url?`<a href="${safe(m.watch_url)}" target="_blank" rel="noopener noreferrer"><button>Watch / Download</button></a>`:"<p>Link not available.</p>"}`;
 document.getElementById("movieModal").classList.remove("hidden");
}

function hideModal(){document.getElementById("movieModal").classList.add("hidden")}
function closeModal(e){if(e.target.id==="movieModal")hideModal()}

async function adminLogin(){
 const msg=document.getElementById("loginMessage");
 msg.textContent="Checking...";
 const {data,error}=await db.auth.signInWithPassword({
  email:document.getElementById("adminEmail").value.trim(),
  password:document.getElementById("adminPassword").value
 });
 if(error){msg.textContent=error.message;return}
 if(data.user.id!==ADMIN_UID){
  await db.auth.signOut();
  msg.textContent="This account is not authorized.";
  return;
 }
 msg.textContent="Login successful.";
 showManage();
}

async function checkAdmin(){
 const {data}=await db.auth.getSession();
 if(data.session&&data.session.user.id===ADMIN_UID) showManage();
 else{
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("manageBox").classList.add("hidden");
 }
}

function showManage(){
 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("manageBox").classList.remove("hidden");
 loadAdminMovies();
}

async function adminLogout(){
 await db.auth.signOut();
 document.getElementById("loginBox").classList.remove("hidden");
 document.getElementById("manageBox").classList.add("hidden");
}

async function loadAdminMovies(){
 const {data,error}=await db.from("movies").select("*").order("created_at",{ascending:false});
 if(error){
  document.getElementById("adminMovieList").textContent=error.message;
  return;
 }
 movies=data||[];
 document.getElementById("adminMovieList").innerHTML=movies.map(m=>`
 <div class="admin-item">
 <span>${safe(m.title)} (${safe(m.category)})</span>
 <div><button class="secondary" onclick="editMovie(${Number(m.id)})">Edit</button>
 <button class="danger" onclick="deleteMovie(${Number(m.id)})">Delete</button></div>
 </div>`).join("")||"<p>No movies added.</p>";
}

function clearForm(){
 ["movieId","movieTitle","movieDescription","moviePoster","movieYear","movieWatch"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("movieCategory").value="Bengali";
 document.getElementById("formHeading").textContent="Add New Movie";
}

function editMovie(id){
 const m=movies.find(x=>Number(x.id)===Number(id));
 if(!m)return;
 document.getElementById("movieId").value=m.id;
 document.getElementById("movieTitle").value=m.title||"";
 document.getElementById("movieDescription").value=m.description||"";
 document.getElementById("moviePoster").value=m.poster_url||"";
 document.getElementById("movieCategory").value=normalizeCategory(m.category)||"Bengali";
 document.getElementById("movieYear").value=m.release_year||"";
 document.getElementById("movieWatch").value=m.watch_url||"";
 document.getElementById("formHeading").textContent="Edit Movie";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function saveMovie(){
 const msg=document.getElementById("adminMessage");
 const id=document.getElementById("movieId").value;
 const title=document.getElementById("movieTitle").value.trim();
 if(!title){msg.textContent="Enter movie title.";return}
 const year=document.getElementById("movieYear").value;
 const record={
  title,
  description:document.getElementById("movieDescription").value.trim(),
  poster_url:document.getElementById("moviePoster").value.trim(),
  category:document.getElementById("movieCategory").value,
  release_year:year?Number(year):null,
  watch_url:document.getElementById("movieWatch").value.trim()
 };
 msg.textContent="Saving...";
 const result=id
  ?await db.from("movies").update(record).eq("id",Number(id))
  :await db.from("movies").insert(record);
 if(result.error){msg.textContent=result.error.message;return}
 msg.textContent="Movie saved successfully.";
 clearForm();
 await loadAdminMovies();
 await loadMovies();
}

async function deleteMovie(id){
 if(!confirm("Delete this movie?"))return;
 const {error}=await db.from("movies").delete().eq("id",Number(id));
 if(error){alert(error.message);return}
 await loadAdminMovies();
 await loadMovies();
}

async function start(){
 showRoute();
 drawCategories();
 if(getRoute()==="admin") await checkAdmin();
 else await loadMovies();
}
start();
</script>
</body>
</html>
