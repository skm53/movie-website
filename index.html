
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Website</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{background:#181818;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font-size:23px;font-weight:bold;color:#ff3838;cursor:pointer}
button{border:0;border-radius:6px;padding:10px 14px;background:#e50914;color:white;cursor:pointer;font-weight:bold}
button:hover{opacity:.85}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #444;border-radius:6px;background:#222;color:white}
.search{max-width:420px}
.container{padding:16px;max-width:1200px;margin:auto}
h2{font-size:20px;margin-top:24px}
.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.category{background:#292929;border-radius:8px;padding:18px 5px;text-align:center;cursor:pointer;font-weight:bold}
.category:hover{background:#e50914}
.movie-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.movie-card{background:#1c1c1c;border-radius:8px;overflow:hidden;cursor:pointer}
.movie-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#292929}
.movie-info{padding:8px}
.movie-info h3{font-size:13px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.movie-info p{font-size:11px;color:#aaa;margin:0}
.page-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-btn{background:#333}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#000d;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px}
.modal-box{background:#202020;padding:20px;border-radius:10px;width:100%;max-width:430px;max-height:90vh;overflow:auto}
.modal-box img{width:130px;max-height:190px;object-fit:cover;border-radius:6px}
.close{float:right;background:#444}
.admin-box{max-width:650px;margin:20px auto;background:#1c1c1c;padding:18px;border-radius:10px}
.admin-list{margin-top:20px}
.admin-item{background:#292929;padding:12px;margin:8px 0;border-radius:7px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.admin-item span{overflow-wrap:anywhere}
.secondary{background:#444}
.danger{background:#b00020}
.empty{color:#aaa;padding:20px 0}
footer{text-align:center;color:#777;padding:25px}
@media(max-width:700px){
 .categories{grid-template-columns:repeat(3,1fr)}
 .movie-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
 .container{padding:12px}
 .movie-info{padding:6px}
 .movie-info h3{font-size:12px}
}
@media(min-width:701px) and (max-width:1000px){
 .movie-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>

<header>
 <div class="logo" onclick="goHome()">🎬 MovieZone</div>
 <input class="search" id="homeSearch" placeholder="Search movies..." oninput="searchHome()">
 <button onclick="openAdmin()">Admin</button>
</header>

<main id="homePage" class="container">
 <h2>Browse Categories</h2>
 <div class="categories" id="categoryTiles"></div>
 <h2>Latest Uploads</h2>
 <div id="latestMovies" class="movie-grid"></div>
 <p id="homeEmpty" class="empty hidden">No movies available yet.</p>
</main>

<main id="categoryPage" class="container hidden">
 <div class="page-title">
  <button class="back-btn" onclick="goHome()">← Home</button>
  <h2 id="categoryHeading"></h2>
 </div>
 <input id="categorySearch" placeholder="Search in this category..." oninput="searchCategory()">
 <div id="categoryMovies" class="movie-grid"></div>
 <p id="categoryEmpty" class="empty hidden">No movies found in this category.</p>
</main>

<main id="adminPage" class="container hidden">
 <div class="admin-box">
  <div class="page-title">
   <h2>Admin Panel</h2>
   <button class="back-btn" onclick="goHome()">Home</button>
  </div>

  <div id="loginBox">
   <h3>Admin Login</h3>
   <input id="adminEmail" type="email" placeholder="Admin email">
   <input id="adminPassword" type="password" placeholder="Password">
   <button onclick="adminLogin()">Login</button>
   <p id="loginMessage"></p>
  </div>

  <div id="manageBox" class="hidden">
   <h3 id="formHeading">Add New Movie</h3>
   <input type="hidden" id="movieId">
   <input id="movieTitle" placeholder="Movie title">
   <textarea id="movieDescription" placeholder="Movie description"></textarea>
   <input id="moviePoster" placeholder="Poster direct image URL">
   <select id="movieCategory">
    <option value="Bengali">Bengali</option>
    <option value="Bollywood">Bollywood</option>
    <option value="Hollywood">Hollywood</option>
    <option value="South">South</option>
    <option value="Web Series">Web Series</option>
   </select>
   <input id="movieYear" type="number" placeholder="Release year">
   <input id="movieWatch" placeholder="Authorized watch / download URL">
   <button onclick="saveMovie()">Save Movie</button>
   <button class="secondary" onclick="clearForm()">Clear</button>
   <button class="danger" onclick="adminLogout()">Logout</button>
   <p id="adminMessage"></p>
   <h3>Manage Movies</h3>
   <div id="adminMovieList" class="admin-list"></div>
  </div>
 </div>
</main>

<div id="movieModal" class="modal hidden" onclick="closeModal(event)">
 <div class="modal-box">
  <button class="close" onclick="hideModal()">✕</button>
  <div id="modalContent"></div>
 </div>
</div>

<footer>MovieZone</footer>

<script>
const SUPABASE_URL = "https://dpoukmguisrnjeppunip.supabase.co";
const SUPABASE_KEY = "sb_publishable_wWaDBcJIp9UfyJxEreo1lg_ZBKj4tPL";
const ADMIN_UID = "c787b61b-1a0d-44f0-881f-0cefefbcbf8b";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const categories = ["Bengali","Bollywood","Hollywood","South","Web Series"];
let movies = [];
let currentCategory = null;

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function getRoute(){
 const params = new URLSearchParams(window.location.search);
 if(params.get("admin")==="1") return "admin";
 const category = params.get("category");
 if(category && categories.includes(category)) return category;
 return "home";
}

function goHome(){
 window.location.href = window.location.pathname;
}

function openAdmin(){
 window.location.href = window.location.pathname + "?admin=1";
}

function openCategory(category){
 window.location.href = window.location.pathname + "?category=" + encodeURIComponent(category);
}

function showRoute(){
 const route = getRoute();
 document.getElementById("homePage").classList.toggle("hidden",route!=="home");
 document.getElementById("categoryPage").classList.toggle("hidden",!categories.includes(route));
 document.getElementById("adminPage").classList.toggle("hidden",route!=="admin");
 document.getElementById("homeSearch").classList.toggle("hidden",route!=="home");
 currentCategory = categories.includes(route) ? route : null;

 if(currentCategory){
  document.getElementById("categoryHeading").textContent=currentCategory+" Movies";
 }
}

function drawCategories(){
 document.getElementById("categoryTiles").innerHTML=categories.map(cat=>
  `<div class="category" onclick="openCategory('${cat}')">${safe(cat)}</div>`
 ).join("");
}

function movieCard(movie){
 const poster = safe(movie.poster_url || "");
 return `
 <div class="movie-card" onclick="showMovie(${Number(movie.id)})">
  <img src="${poster}" alt="${safe(movie.title)}" loading="lazy"
   onerror="this.style.display='none'">
  <div class="movie-info">
   <h3>${safe(movie.title)}</h3>
   <p>${safe(movie.release_year || "")} · ${safe(movie.category || "")}</p>
  </div>
 </div>`;
}

async function loadMovies(){
 const {data,error}=await db.from("movies").select("*").order("created_at",{ascending:false});
 if(error){
  console.error(error);
  document.getElementById("latestMovies").innerHTML='<p class="empty">Could not load movies. Please check database permissions.</p>';
  return;
 }
 movies=data || [];
 renderHome();
 if(currentCategory) renderCategory();
}

function renderHome(list=movies){
 const latest=list.slice(0,12);
 document.getElementById("latestMovies").innerHTML=latest.map(movieCard).join("");
 document.getElementById("homeEmpty").classList.toggle("hidden",latest.length!==0);
}

function searchHome(){
 const q=document.getElementById("homeSearch").value.toLowerCase().trim();
 const filtered=movies.filter(m=>
  (m.title||"").toLowerCase().includes(q) ||
  (m.category||"").toLowerCase().includes(q)
 );
 renderHome(filtered);
}

function renderCategory(list){
 const items=(list || movies).filter(m=>m.category===currentCategory);
 document.getElementById("categoryMovies").innerHTML=items.map(movieCard).join("");
 document.getElementById("categoryEmpty").classList.toggle("hidden",items.length!==0);
}

function searchCategory(){
 const q=document.getElementById("categorySearch").value.toLowerCase().trim();
 const filtered=movies.filter(m=>
  m.category===currentCategory &&
  ((m.title||"").toLowerCase().includes(q) ||
   (m.description||"").toLowerCase().includes(q))
 );
 renderCategory(filtered);
}

function showMovie(id){
 const movie=movies.find(m=>Number(m.id)===Number(id));
 if(!movie) return;
 document.getElementById("modalContent").innerHTML=`
  <h2>${safe(movie.title)}</h2>
  <img src="${safe(movie.poster_url||"")}" alt="${safe(movie.title)}">
  <p>${safe(movie.category)} · ${safe(movie.release_year||"")}</p>
  <p>${safe(movie.description||"No description available.")}</p>
  ${movie.watch_url ? `<a href="${safe(movie.watch_url)}" target="_blank" rel="noopener noreferrer"><button>Watch / Download</button></a>` : "<p>Link not available.</p>"}
 `;
 document.getElementById("movieModal").classList.remove("hidden");
}

function hideModal(){
 document.getElementById("movieModal").classList.add("hidden");
}

function closeModal(event){
 if(event.target.id==="movieModal") hideModal();
}

async function adminLogin(){
 const email=document.getElementById("adminEmail").value.trim();
 const password=document.getElementById("adminPassword").value;
 const msg=document.getElementById("loginMessage");
 msg.textContent="Checking login...";
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){
  msg.textContent=error.message;
  return;
 }
 if(data.user.id!==ADMIN_UID){
  await db.auth.signOut();
  msg.textContent="This account is not authorized as admin.";
  return;
 }
 msg.textContent="Login successful.";
 showManage();
}

async function checkAdmin(){
 const {data}=await db.auth.getSession();
 if(data.session && data.session.user.id===ADMIN_UID){
  showManage();
 }else{
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("manageBox").classList.add("hidden");
 }
}

function showManage(){
 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("manageBox").classList.remove("hidden");
 loadAdminMovies();
}

async function adminLogout(){
 await db.auth.signOut();
 document.getElementById("loginBox").classList.remove("hidden");
 document.getElementById("manageBox").classList.add("hidden");
}

async function loadAdminMovies(){
 const {data,error}=await db.from("movies").select("*").order("created_at",{ascending:false});
 if(error){
  document.getElementById("adminMovieList").textContent=error.message;
  return;
 }
 movies=data || [];
 document.getElementById("adminMovieList").innerHTML=movies.map(m=>`
  <div class="admin-item">
   <span>${safe(m.title)} (${safe(m.category)})</span>
   <div>
    <button class="secondary" onclick="editMovie(${Number(m.id)})">Edit</button>
    <button class="danger" onclick="deleteMovie(${Number(m.id)})">Delete</button>
   </div>
  </div>
 `).join("") || "<p>No movies added.</p>";
}

function clearForm(){
 ["movieId","movieTitle","movieDescription","moviePoster","movieYear","movieWatch"].forEach(id=>{
  document.getElementById(id).value="";
 });
 document.getElementById("movieCategory").value="Bengali";
 document.getElementById("formHeading").textContent="Add New Movie";
}

function editMovie(id){
 const m=movies.find(x=>Number(x.id)===Number(id));
 if(!m) return;
 document.getElementById("movieId").value=m.id;
 document.getElementById("movieTitle").value=m.title||"";
 document.getElementById("movieDescription").value=m.description||"";
 document.getElementById("moviePoster").value=m.poster_url||"";
 document.getElementById("movieCategory").value=m.category||"Bengali";
 document.getElementById("movieYear").value=m.release_year||"";
 document.getElementById("movieWatch").value=m.watch_url||"";
 document.getElementById("formHeading").textContent="Edit Movie";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function saveMovie(){
 const msg=document.getElementById("adminMessage");
 const id=document.getElementById("movieId").value;
 const title=document.getElementById("movieTitle").value.trim();
 if(!title){
  msg.textContent="Please enter movie title.";
  return;
 }
 const year=document.getElementById("movieYear").value;
 const record={
  title,
  description:document.getElementById("movieDescription").value.trim(),
  poster_url:document.getElementById("moviePoster").value.trim(),
  category:document.getElementById("movieCategory").value,
  release_year:year ? Number(year) : null,
  watch_url:document.getElementById("movieWatch").value.trim()
 };
 msg.textContent="Saving...";
 let result;
 if(id){
  result=await db.from("movies").update(record).eq("id",Number(id));
 }else{
  result=await db.from("movies").insert(record);
 }
 if(result.error){
  msg.textContent="Error: "+result.error.message;
  return;
 }
 msg.textContent="Movie saved successfully.";
 clearForm();
 await loadAdminMovies();
 await loadMovies();
}

async function deleteMovie(id){
 if(!confirm("Are you sure you want to delete this movie?")) return;
 const {error}=await db.from("movies").delete().eq("id",Number(id));
 if(error){
  alert("Delete failed: "+error.message);
  return;
 }
 alert("Movie deleted.");
 await loadAdminMovies();
 await loadMovies();
}

async function start(){
 showRoute();
 drawCategories();
 if(getRoute()==="admin"){
  await checkAdmin();
 }else{
  await loadMovies();
 }
}

start();
</script>
</body>
</html>
